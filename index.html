<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbf9" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Kodama" />
    <script>
      // A saved dark theme, applied before anything is drawn (light is the default).
      try {
        if (localStorage.getItem('shadowing:theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#151513';
        }
      } catch (e) {}
    </script>
    <title>Kodama</title>
    <meta name="description" content="TEDのトークや手持ちの音声を1文ずつに区切って、英語のシャドーイングを練習するアプリです。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@200..700&family=Noto+Sans+JP:wght@200..700&display=swap" rel="stylesheet" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300&text=0123456789&display=swap" rel="stylesheet" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
